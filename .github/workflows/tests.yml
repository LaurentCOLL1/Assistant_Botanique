name: Tests

on:
  push:
    branches: [main, "v3/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src *.py
      - run: pytest --cov=assistant_botanique --cov-report=term-missing -q
      - name: Validate Windows installer syntax
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test Windows Python detection
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File install-windows.ps1 -SelfTest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check .
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python validate_data.py --strict --baseline data_quality_baseline.json

  catalogue-enrichment:
    if: github.event_name == 'pull_request' && github.head_ref == 'catalogue/full-audit-photos'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vérifier la syntaxe
        run: >-
          python -m py_compile
          tools/catalogue_enrichment.py
          tools/catalogue_enrichment_parallel.py
          tools/photo_batch_enrichment.py
      - name: Produire ou compléter l'audit
        shell: bash
        run: |
          if [[ -f catalogue_metadata/taxonomy_audit.json && -f catalogue_metadata/photos.json ]]; then
            python tools/photo_batch_enrichment.py
          else
            python tools/catalogue_enrichment_parallel.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-audit-results
          path: |
            catalogue_metadata/taxonomy_audit.json
            catalogue_metadata/photos.json
            catalogue_metadata/catalogue_audit_report.md
          if-no-files-found: error
          retention-days: 7
      - name: Enregistrer les résultats dans la branche
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[catalogue-bot\]'; then
            echo "Résultats déjà produits par le robot."
            exit 0
          fi
          git config user.name "assistant-botanique-catalogue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogue_metadata/taxonomy_audit.json catalogue_metadata/photos.json catalogue_metadata/catalogue_audit_report.md
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "data: audit exhaustif et photos [catalogue-bot]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
