name: Tests

on:
  push:
    branches: [main, "v3/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src *.py
      - run: pytest --cov=assistant_botanique --cov-report=term-missing -q
      - name: Validate Windows installer syntax
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test Windows Python detection
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.11'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File install-windows.ps1 -SelfTest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check .
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python validate_data.py --strict --baseline data_quality_baseline.json
