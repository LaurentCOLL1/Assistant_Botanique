name: Catalogue enrichment

on:
  push:
    branches:
      - catalogue/full-audit-photos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-enrich:
    if: ${{ !contains(github.event.head_commit.message || '', '[catalogue-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalogue/full-audit-photos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vérifier la syntaxe du script
        run: python -m py_compile tools/catalogue_enrichment.py
      - name: Auditer toutes les fiches et rechercher les photos
        run: python tools/catalogue_enrichment.py
      - name: Enregistrer les résultats
        shell: bash
        run: |
          if git diff --quiet -- catalogue_metadata/taxonomy_audit.json catalogue_metadata/photos.json catalogue_metadata/catalogue_audit_report.md; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git config user.name "assistant-botanique-catalogue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogue_metadata/taxonomy_audit.json catalogue_metadata/photos.json catalogue_metadata/catalogue_audit_report.md
          git commit -m "data: audit exhaustif et photos [catalogue-bot]"
          git push origin HEAD:catalogue/full-audit-photos
