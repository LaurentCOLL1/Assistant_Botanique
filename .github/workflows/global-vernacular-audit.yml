name: Global vernacular audit

on:
  pull_request:
    paths:
      - "tools/enrich_catalogue_vernaculars.py"
      - ".github/workflows/global-vernacular-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'feat/selenicereus-vernaculars'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rechercher les noms vernaculaires manquants
        run: |
          python -m py_compile tools/enrich_catalogue_vernaculars.py
          PYTHONPATH=. python tools/enrich_catalogue_vernaculars.py
          PYTHONPATH=src:. python validate_data.py --strict --baseline data_quality_baseline.json
      - name: Enregistrer l'audit
        shell: bash
        run: |
          git config user.name "assistant-botanique-vernacular-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A familles_plantes catalogue_metadata/global_vernacular_name_audit.json
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi
          git commit -m "data: compléter les noms vernaculaires du catalogue [global-vernacular-bot]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
