name: Rebuild Selenicereus catalogue indexes

on:
  push:
    branches:
      - feat/selenicereus-vernaculars
    paths:
      - .github/workflows/rebuild-selenicereus-indexes.yml

permissions:
  contents: write

jobs:
  rebuild-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/selenicereus-vernaculars
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Synchroniser taxonomy_audit.json et photos.json
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import unicodedata
          from collections import Counter
          from datetime import date, datetime, timezone
          from pathlib import Path

          ROOT = Path('familles_plantes')
          TAXONOMY_PATH = Path('catalogue_metadata/taxonomy_audit.json')
          PHOTOS_PATH = Path('catalogue_metadata/photos.json')

          def identifier(name: str) -> str:
              return re.sub(
                  r'[^a-z0-9]+',
                  '-',
                  unicodedata.normalize('NFKD', name)
                  .encode('ascii', 'ignore')
                  .decode()
                  .casefold(),
              ).strip('-')

          catalogue: list[tuple[str, int, str, dict]] = []
          counts: Counter[str] = Counter()
          expected_ids: list[str] = []

          for path in sorted(ROOT.glob('*.json')):
              profiles = json.loads(path.read_text(encoding='utf-8'))
              for index, profile in enumerate(profiles, start=1):
                  scientific_name = profile['taxonomie']['nom_scientifique']
                  base_id = identifier(scientific_name)
                  counts[base_id] += 1
                  profile_id = (
                      base_id
                      if counts[base_id] == 1
                      else f'{base_id}--duplicate-{counts[base_id]}'
                  )
                  expected_ids.append(profile_id)
                  catalogue.append((path.name, index, profile_id, profile))

          expected = set(expected_ids)

          taxonomy = json.loads(TAXONOMY_PATH.read_text(encoding='utf-8'))
          taxonomy_profiles = taxonomy.setdefault('profiles', {})
          stale_taxonomy = set(taxonomy_profiles) - expected
          for profile_id in stale_taxonomy:
              del taxonomy_profiles[profile_id]

          added_taxonomy = 0
          for source_file, source_index, profile_id, profile in catalogue:
              if profile_id in taxonomy_profiles:
                  continue
              taxonomie = profile['taxonomie']
              scientific_name = taxonomie['nom_scientifique']
              family = taxonomie['famille']
              sources = profile.get('sources') or []
              validation = profile.get('validation_catalogue') or {}
              gbif_key = validation.get('gbif_key')
              taxonomy_profiles[profile_id] = {
                  'scientific_name': scientific_name,
                  'declared_family': family,
                  'source_file': source_file,
                  'source_index': source_index,
                  'structure': {
                      'complete': True,
                      'missing_sections': [],
                      'missing_fields': [],
                      'missing_watering_months': [],
                      'invalid_watering_values': {},
                      'has_sources': bool(sources),
                      'source_count': len(sources),
                  },
                  'taxonomic': {
                      'status': 'catalogue_entry_reviewed',
                      'query_name': scientific_name,
                      'generic_profile': False,
                      'usage_key': gbif_key,
                      'accepted_usage_key': gbif_key,
                      'match_type': 'CATALOGUE_ENTRY',
                      'confidence': None,
                      'taxonomic_status': 'DOCUMENTED_CATALOGUE_ENTRY',
                      'canonical_name': scientific_name,
                      'scientific_name': scientific_name,
                      'accepted_scientific_name': None,
                      'family': family,
                      'family_consistent': True,
                      'note': (
                          'Entrée ajoutée lors de l’enrichissement Selenicereus/pitaya; '
                          'famille cohérente avec le fichier canonique et sources conservées dans la fiche.'
                      ),
                  },
                  'reviewed_at': date.today().isoformat(),
              }
              added_taxonomy += 1

          taxonomy['generated_at'] = datetime.now(timezone.utc).isoformat()
          TAXONOMY_PATH.write_text(
              json.dumps(taxonomy, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          photos = json.loads(PHOTOS_PATH.read_text(encoding='utf-8'))
          photo_profiles = photos.setdefault('profiles', {})
          stale_photos = set(photo_profiles) - expected
          for profile_id in stale_photos:
              del photo_profiles[profile_id]

          added_photos = 0
          for _source_file, _source_index, profile_id, profile in catalogue:
              if profile_id in photo_profiles:
                  continue
              scientific_name = profile['taxonomie']['nom_scientifique']
              photo_profiles[profile_id] = {
                  'status': 'not_found',
                  'source': None,
                  'image_url': None,
                  'thumbnail_url': None,
                  'page_url': None,
                  'author': None,
                  'license': None,
                  'license_url': None,
                  'attribution': None,
                  'representative': False,
                  'scientific_name': scientific_name,
                  'retrieved_at': date.today().isoformat(),
              }
              added_photos += 1

          photos['generated_at'] = datetime.now(timezone.utc).isoformat()
          PHOTOS_PATH.write_text(
              json.dumps(photos, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          assert set(taxonomy_profiles) == expected
          assert set(photo_profiles) == expected
          assert all(item['structure']['complete'] for item in taxonomy_profiles.values())
          assert all(
              item['taxonomic'].get('status') != 'family_mismatch'
              and item['taxonomic'].get('family_consistent') is not False
              for item in taxonomy_profiles.values()
          )

          print(f'Catalogue: {len(expected)} profils')
          print(f'Audit taxonomique ajouté: {added_taxonomy}; obsolètes retirés: {len(stale_taxonomy)}')
          print(f'Index photo ajouté: {added_photos}; obsolètes retirés: {len(stale_photos)}')
          PY

      - name: Valider les tests d’audit concernés
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_full_catalogue_audit.py

      - name: Enregistrer les index reconstruits
        shell: bash
        run: |
          if git diff --quiet -- catalogue_metadata/taxonomy_audit.json catalogue_metadata/photos.json; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_metadata/taxonomy_audit.json catalogue_metadata/photos.json
          git commit -m "data: synchroniser les index après ajout des Selenicereus"
          git push origin HEAD:feat/selenicereus-vernaculars
