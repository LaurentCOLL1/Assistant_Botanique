name: Publish beta release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write

env:
  RELEASE_TAG: v3.5.1-beta.10
  RELEASE_NAME: Assistant Botanique 3.5.1 Beta 10
  INSTALLER_BASE_NAME: AssistantBotanique-Setup-3.5.1-beta.10

jobs:
  build-installer:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Construire et valider l'installateur Windows
        shell: pwsh
        run: >-
          ./tools/build_windows_installer.ps1
          -DisplayVersion "3.5.1-beta.10"
          -OutputBaseFilename "${{ env.INSTALLER_BASE_NAME }}"
          -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/output/${{ env.INSTALLER_BASE_NAME }}.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Générer le contrôle SHA-256
        shell: bash
        run: sha256sum "release-assets/${INSTALLER_BASE_NAME}.exe" > "release-assets/${INSTALLER_BASE_NAME}.exe.sha256"
      - name: Créer ou compléter la préversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_NAME" \
              --notes-file docs/releases/v3.5.1-beta.10.md \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            "release-assets/${INSTALLER_BASE_NAME}.exe" \
            "release-assets/${INSTALLER_BASE_NAME}.exe.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          published_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq "${INSTALLER_BASE_NAME}.exe" <<<"$published_assets"
          grep -Fxq "${INSTALLER_BASE_NAME}.exe.sha256" <<<"$published_assets"
