name: Publish beta release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Créer la préversion si nécessaire
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v3.5.1-beta.5';
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`La release ${tag} existe déjà.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = fs.readFileSync('docs/releases/v3.5.1-beta.5.md', 'utf8');
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: process.env.RELEASE_SHA,
              name: 'Assistant Botanique 3.5.1 Beta 5',
              body,
              prerelease: true,
              draft: false,
            });
