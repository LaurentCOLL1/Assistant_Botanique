[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-botanique"
version = "3.5.1b8"
description = "Application de bureau pour gérer une collection de plantes, apprendre leur rythme de soins et documenter leur évolution."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Laurent COLL1"}]
dependencies = [
  "Pillow>=10.4",
  "plyer>=2.1",
  "qrcode>=8.2",
  "cryptography>=43.0",
  "packaging>=24.2",
  "zxing-cpp>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pyinstaller>=6.10",
]

[project.scripts]
assistant-botanique = "assistant_botanique.__main__:main"

[tool.setuptools]
package-dir = {assistant_botanique = "src/assistant_botanique"}
packages = ["assistant_botanique", "assistant_botanique.domain", "assistant_botanique.features", "assistant_botanique.infrastructure", "assistant_botanique.services", "assistant_botanique.ui"]
py-modules = [
  "app_data",
  "app_paths",
  "core",
  "data",
  "main",
  "recipe_engine",
  "storage",
  "substrate_classifier",
  "substrate_consensus",
  "substrate_consensus_stability",
  "substrate_consensus_v2",
  "substrate_knowledge",
  "tab_catalogue",
  "tab_diagnostic",
  "tab_gestion",
  "tab_substrat",
  "ui_theme",
  "validate_data",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["familles_plantes", "data.py"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/catalogue_enrichment.py" = ["F401"]
"tools/photo_batch_enrichment.py" = ["F401"]
"src/assistant_botanique/ui/collection_intelligence_tab.py" = ["F401"]
# Ces deux callbacks historiques sont immédiatement remplacés par runtime_fixes,
# qui capture correctement les messages d'erreur avant leur passage à Tkinter.
"src/assistant_botanique/features/integration.py" = ["F821", "F841"]
